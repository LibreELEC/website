name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Configure custom domain for LibreELEC production
        if: github.repository == 'LibreELEC/website' || github.repository == 'libreelec/website'
        run: echo "libreelec.tv" > ./public/CNAME

      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: ${{ (github.repository == 'LibreELEC/website' || github.repository == 'libreelec/website') && 'https://libreelec.tv' || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ (github.repository == 'LibreELEC/website' || github.repository == 'libreelec/website') && '/' || format('/{0}', github.event.repository.name) }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
